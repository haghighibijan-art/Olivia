<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Lista Nascita di Olivia ✨ Regala un'avventura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f27a7d;
      --primary-hover: #e06265;
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --accent: #fcd34d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
      font-weight: 800;
    }

    header p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 650px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 35px rgba(0,0,0,0.12);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      background: #eee;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .price-tag {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      color: var(--text);
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.95rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .card-snippet {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      flex-grow: 1;
    }

    .btn-detail {
      background: #f8fafc;
      color: var(--primary);
      border: 1px solid #ffe4e6;
      border-radius: 12px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s;
    }

    .card:hover .btn-detail {
      background: var(--primary);
      color: #fff;
    }

    /* Modale */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      max-width: 520px;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      animation: popIn 0.25s ease-out;
      max-height: 90vh; /* Evita che esca dallo schermo se l'immagine è alta */
      display: flex;
      flex-direction: column;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(0,0,0,0.9);
    }

    /* CSS AGGIORNATO PER L'IMMAGINE INTERA E CLICCABILE */
    #modalImgLink {
      display: block;
      background-color: #f1f5f9; /* Sfondo chiaro per riempire eventuali spazi vuoti */
      text-align: center;
      cursor: zoom-in; /* Mostra l'icona della lente di ingrandimento */
    }

    .modal-img {
      width: 100%;
      height: auto;
      max-height: 40vh; /* Altezza massima dinamica per adattarsi allo schermo */
      object-fit: contain; /* Non taglia l'immagine, la ridimensiona mostrandola tutta */
      display: block;
      margin: 0 auto;
      transition: opacity 0.2s;
    }

    .modal-img:hover {
      opacity: 0.85; /* Effetto visivo al passaggio del mouse */
    }

    .modal-content {
      padding: 1.75rem;
      overflow-y: auto; /* Permette di scorrere il testo se è troppo lungo */
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .modal-header h2 {
      font-size: 1.35rem;
      color: var(--text);
      font-weight: 800;
    }

    .modal-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
    }

    .modal-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn-buy {
      display: block;
      width: 100%;
      background: #0070ba;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
      padding: 0.9rem 1.2rem;
      border-radius: 14px;
      font-size: 1.05rem;
      transition: background 0.2s;
    }

    .btn-buy:hover {
      background: #005ea6;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Le Future Avventure di Olivia 🍼✨</h1>
      <p>Cari Amici e Parenti, abbiamo già quasi tutto il  materiale necessario per accogliere Olivia. Se desiderate farle un regalo, abbiamo pensato ad un contributo per i suoi primi ricordi ed esperienze di vita!</p>
    </header>

    <div class="grid" id="grid"></div>
  </div>

  <!-- Modale Dettagli -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      
      <!-- NUOVO WRAPPER: L'immagine ora è dentro un link cliccabile -->
      <a id="modalImgLink" href="" target="_blank" title="Clicca per ingrandire l'immagine">
        <img id="modalImg" class="modal-img" src="" alt="Esperienza">
      </a>
      
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
          <span class="modal-price" id="modalPrice"></span>
        </div>
        <p class="modal-desc" id="modalDesc"></p>
        <a id="modalPaypalBtn" class="btn-buy" target="_blank" rel="noopener">🎁 Regala con PayPal</a>
      </div>
    </div>
  </div>

  <script>
    // 💡 INSERISCI QUI IL TUO USERNAME PAYPAL.ME
    const PAYPAL_USERNAME = "TUONOME"; 

    const experiences = [
      {
        id: 1,
        title: "Il primo viaggio in aereo di Olivia",
        price: 50,
        image: "volo.jpg",
        snippet: "Battesimo dell'aria per esplorare nuove città insieme a mamma e papà.",
        description: "Un contributo per il primo volo di Olivia! Include la prenotazione del posto, i primi documenti di viaggio e l'inizio del suo diario tra le nuvole."
      },
      {
        id: 2,
        title: "La prima volta a Gardaland di Olivia",
        price: 40,
        image: "gardaland.jpg",
        snippet: "Una giornata magica tra personaggi delle fiabe, colori e giostre.",
        description: "Una giornata intera immersi nel divertimento di Gardaland! Tra palloncini colorati, trenini a tema e le risate sul carosello delle fiabe."
      },
      {
        id: 3,
        title: "La prima volta a Collodi di Olivia",
        price: 30,
        image: "collodi.jpg",
        snippet: "Alla scoperta del Parco di Pinocchio e delle meraviglie toscane.",
        description: "Visita al Parco di Pinocchio a Collodi: una passeggiata tra sculture all'aperto, teatrini di marionette e sentieri incantati nella natura."
      },
      {
        id: 4,
        title: "Il primo corso di nuoto di Olivia",
        price: 60,
        image: "piscina.jpg",
        snippet: "Corso di acquaticità neonatale per giocare in acqua in sicurezza.",
        description: "Il pacchetto per il primo corso di acquaticità neonatale: per familiarizzare con l'acqua, migliorare la coordinazione e fare tanti tuffi spensierati."
      },
      {
        id: 5,
        title: "Prime lezioni di surf per Olivia a Fuerteventura",
        price: 50,
        image: "surf.jpg",
        snippet: "Onde oceaniche, sabbia dorata e le prime pagaiate sulla tavola.",
        description: "Un'avventura tra le onde delle Canarie! Include le prime lezioni di baby-surf con istruttore, mutina e tanto divertimento sulle spiagge di Fuerteventura."
      },
      {
        id: 6,
        title: "Primo viaggio e Baby dance a Ibiza per Olivia",
        price: 50,
        image: "ibiza.jpg",
        snippet: "Tramonti spettacolari, musica e i primi balli a piedi nudi sulla spiaggia.",
        description: "Alla scoperta dell'isola magica: giornate in calette tranquille, merende vista mare e scatenatissimi balli serali di baby dance al tramonto!"
      },
      {
        id: 7,
        title: "Prime lezioni di sci all'Abetone",
        price: 50,
        image: "abetone.jpg",
        snippet: "Pupazzi di neve, slittino e i primi passi con gli sciettini sulla neve fresca.",
        description: "Il battesimo della neve sulle vette toscane dell'Abetone: maestri di sci dedicati ai più piccoli, noleggio attrezzatura e cioccolata calda al rifugio."
      },
      {
        id: 8,
        title: "La prima volta di Olivia all'Acquario di Genova",
        price: 40,
        image: "acquario.jpg",
        snippet: "Tra delfini, foche e squali nei fondali marini più affascinanti.",
        description: "Un viaggio magico sotto il mare tra le vasche giganti dell'Acquario di Genova: per ammirare da vicino i delfini, i pinguini e le creature degli abissi con gli occhi pieni di stupore!"
      },
      {
        id: 9,
        title: "Supporto psicologico e aperitivi per Babbo e Mamma",
        price: 10,
        image: "supporto.jpg",
        snippet: "Un calice di vino, uno spritz e un momento di tregua per ricaricare le batterie.",
        description: "I viaggi e le avventure con Olivia saranno stupendi, ma ogni tanto mamma Camilla e babbo avranno bisogno di una sacrosanta pausa spritz per sopravvivere alle notti insonni. La salute mentale dei genitori ringrazia calorosamente!"
      },
      {
        id: 10,
        title: "Per un regalo tradizionale - IDEALBIMBO",
        price: "Variabile", 
        image: "lista.jpg",
        snippet: "Se preferisci un oggettino classico, abbiamo preparato anche una lista in negozio.",
        description: "Siamo stati da Idealbimbo e abbiamo creato una wishlist dedicata con le cose più classiche e utili per i primi mesi. Cliccando il bottone qui sotto potrai accedere alla pagina del negozio (ti basterà inserire i dati di login, NUMERO LISTA: 616386  -  PASSWORD: OLIVIA ).",
        isExternalLink: true,
        urlTarget: "https://www.idealbimbo.it/lista-di-nascita.asp"
      }
    ];

    const grid = document.getElementById("grid");
    const backdrop = document.getElementById("modalBackdrop");
    const modalImg = document.getElementById("modalImg");
    const modalImgLink = document.getElementById("modalImgLink"); // Aggiunto link immagine
    const modalTitle = document.getElementById("modalTitle");
    const modalPrice = document.getElementById("modalPrice");
    const modalDesc = document.getElementById("modalDesc");
    const modalPaypalBtn = document.getElementById("modalPaypalBtn");

    experiences.forEach(exp => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openModal(exp);
      
      const priceText = typeof exp.price === 'number' ? exp.price + "€" : exp.price;
      
      card.innerHTML = `
        <div class="card-img-wrapper">
          <img src="${exp.image}" alt="${exp.title}" loading="lazy">
          <span class="price-tag">${priceText}</span>
        </div>
        <div class="card-body">
          <h3 class="card-title">${exp.title}</h3>
          <p class="card-snippet">${exp.snippet}</p>
          <div class="btn-detail">Scopri e contribuisci ➔</div>
        </div>
      `;
      grid.appendChild(card);
    });

    function openModal(exp) {
      modalImg.src = exp.image;
      modalImgLink.href = exp.image; // Questo fa sì che il clic sull'immagine apra il file originale
      
      modalTitle.innerText = exp.title;
      modalDesc.innerText = exp.description;
      
      const priceText = typeof exp.price === 'number' ? exp.price + "€" : exp.price;
      modalPrice.innerText = priceText;
      
      if (exp.isExternalLink) {
        modalPaypalBtn.href = exp.urlTarget;
        modalPaypalBtn.innerText = `🛍️ Vai alla lista su Idealbimbo`;
        modalPaypalBtn.style.background = "#e53e3e"; 
      } else {
        modalPaypalBtn.href = `https://paypal.me/${PAYPAL_USERNAME}/${exp.price}EUR`;
        modalPaypalBtn.innerText = `🎁 Regala ${exp.price}€ con PayPal`;
        modalPaypalBtn.style.background = "#0070ba"; 
      }

      backdrop.style.display = "flex";
    }

    function closeModal() {
      backdrop.style.display = "none";
    }

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });
  </script>
</body>
</html>
